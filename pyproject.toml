[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-terminal"
version = "0.5.1"
description = "Local-first crypto perpetual opportunity terminal"
requires-python = ">=3.12"
dependencies = [
  "cryptography==46.0.7",
  "duckdb==1.5.5",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.52.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller==6.21.0",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
crypto-signal-service = "crypto_signal_terminal.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using .*starlette.testclient.*",
]
